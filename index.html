<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

<style>
/* Layout: one column app shell — header with period + upload, tabbed views (overview / transactions / categories) */
:root {
  --bg: #f4f6f3;
  --surface: #ffffff;
  --sunk: #e9ede8;
  --fg: #17211e;
  --muted: #5c6b66;
  --line: #d5ddd8;
  --accent: #1d6b5c;
  --accent-fg: #ffffff;
  --accent-soft: #dcebe6;
  --good: #24794a;
  --bad: #b2412e;
  --warn-bg: #fbf0d6;
  --warn-fg: #6d4f09;
  --shadow: 0 1px 2px rgba(20, 40, 34, .06), 0 4px 16px rgba(20, 40, 34, .06);
  --font-display: "Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --font-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111715; --surface: #18201d; --sunk: #202a26; --fg: #e6ece9; --muted: #95a59f; --line: #2c3833;
    --accent: #5cbfa6; --accent-fg: #0c1714; --accent-soft: #1d3530; --good: #6fcf97; --bad: #f08a75;
    --warn-bg: #3a2f14; --warn-fg: #f1d48c; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111715; --surface: #18201d; --sunk: #202a26; --fg: #e6ece9; --muted: #95a59f; --line: #2c3833;
  --accent: #5cbfa6; --accent-fg: #0c1714; --accent-soft: #1d3530; --good: #6fcf97; --bad: #f08a75;
  --warn-bg: #3a2f14; --warn-fg: #f1d48c; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.25);
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 48px;
}
.shell { max-width: 1080px; margin: 0 auto; }
button, select, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

header.top { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; padding-block: 22px 14px; }
.brand { display: flex; align-items: baseline; gap: 10px; margin-right: auto; }
.brand h1 { font-family: var(--font-display); font-weight: 700; font-size: 28px; letter-spacing: -.02em; margin: 0; }
.brand .mark { width: 14px; height: 14px; border-radius: 4px; background: var(--accent); align-self: center; transform: rotate(12deg); }
.brand small { color: var(--muted); font-size: 13px; }
.top-actions { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 8px 14px; cursor: pointer; font-weight: 500; display: inline-flex; align-items: center; gap: 8px; white-space: nowrap; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--accent); padding-inline: 8px; }
.btn.danger { color: var(--bad); }
.btn.danger.armed { background: var(--bad); color: var(--surface); border-color: var(--bad); }
.btn:disabled { opacity: .5; cursor: default; }
select.sel, input.inp { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 8px 12px; min-width: 0; }

nav.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 22px; overflow-x: auto; }
nav.tabs button { background: none; border: none; padding: 10px 14px; cursor: pointer; color: var(--muted); font-weight: 600; border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; }
nav.tabs button[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--accent); }
nav.tabs .count { font-weight: 500; color: var(--muted); font-size: 12px; margin-left: 4px; }

.banner { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; background: var(--warn-bg); color: var(--warn-fg); border-radius: 12px; padding: 12px 16px; margin-bottom: 20px; }
.banner p { margin: 0; flex: 1 1 280px; }
.banner.info { background: var(--accent-soft); color: var(--fg); }

.drop {
  border: 1.5px dashed var(--line); border-radius: 14px; padding: 18px 20px; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px;
  background: var(--surface); margin-bottom: 24px; transition: border-color .15s, background .15s;
}
.drop.over, body.dragging .drop { border-color: var(--accent); background: var(--accent-soft); }
.drop .icon { width: 40px; height: 40px; border-radius: 10px; background: var(--accent-soft); display: grid; place-items: center; color: var(--accent); flex: none; }
.drop .txt { flex: 1 1 260px; min-width: 0; }
.drop strong { display: block; }
.drop span { color: var(--muted); font-size: 13px; }

.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin-bottom: 28px; }
.stat { background: var(--surface); border-radius: 14px; padding: 16px 18px; box-shadow: var(--shadow); min-width: 0; }
.stat .lbl { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; }
.stat .val { font-family: var(--font-display); font-size: clamp(22px, 4vw, 32px); font-weight: 700; letter-spacing: -.02em; margin-top: 2px; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.stat .sub { font-size: 13px; color: var(--muted); }
.pos { color: var(--good); }
.neg { color: var(--bad); }

.grid2 { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 28px; align-items: start; }
h2 { font-family: var(--font-display); font-size: 20px; font-weight: 700; letter-spacing: -.01em; margin: 0 0 12px; text-wrap: balance; }
h2 .aside { font-family: var(--font-body); font-size: 13px; font-weight: 500; color: var(--muted); margin-left: 6px; letter-spacing: 0; }
.panel { background: var(--surface); border-radius: 14px; padding: 18px; box-shadow: var(--shadow); min-width: 0; }

.cats { display: flex; flex-direction: column; gap: 2px; }
.catrow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; padding: 8px 10px; border-radius: 10px; cursor: pointer; border: none; background: none; text-align: left; width: 100%; }
.catrow:hover { background: var(--sunk); }
.catrow .name { display: flex; align-items: center; gap: 8px; min-width: 0; font-weight: 500; }
.catrow .name span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.catrow .amt { text-align: right; }
.catrow .amt small { color: var(--muted); margin-left: 8px; font-size: 12px; }
.bar { grid-column: 1 / -1; height: 6px; background: var(--sunk); border-radius: 3px; overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: 3px; }
.dot { width: 10px; height: 10px; border-radius: 50%; flex: none; display: inline-block; }

.chart { display: flex; align-items: flex-end; gap: 6px; height: 170px; padding: 0 0 0 56px; position: relative; margin-top: 8px; }
.chart .gl { position: absolute; left: 56px; right: 0; border-top: 1px dashed var(--line); }
.chart .gl span { position: absolute; left: -56px; top: -8px; width: 50px; text-align: right; font-size: 11px; color: var(--muted); }
.chart .col { flex: 1; display: flex; flex-direction: column; align-items: center; height: 100%; justify-content: flex-end; position: relative; min-width: 0; cursor: pointer; border: none; background: none; padding: 0; }
.chart .col i { width: 100%; max-width: 34px; background: var(--accent); border-radius: 4px 4px 0 0; opacity: .85; min-height: 1px; }
.chart .col:hover i, .chart .col.sel i { opacity: 1; filter: brightness(1.1); }
.chart .col.sel i { outline: 2px solid var(--fg); outline-offset: 1px; }
.chart-x { display: flex; gap: 6px; padding-left: 56px; margin-top: 6px; }
.chart-x span { flex: 1; text-align: center; font-size: 11px; color: var(--muted); min-width: 0; overflow: hidden; }

.callout { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; padding: 14px 16px; border-radius: 12px; background: var(--warn-bg); color: var(--warn-fg); margin-bottom: 20px; }
.callout p { margin: 0; flex: 1 1 240px; }

.toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 14px; }
.toolbar .inp { flex: 1 1 220px; }
.toolbar .summary { margin-left: auto; color: var(--muted); font-size: 13px; }
.tablewrap { overflow-x: auto; background: var(--surface); border-radius: 14px; box-shadow: var(--shadow); }
table { border-collapse: collapse; width: 100%; }
th { text-align: left; font-size: 12px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 600; padding: 12px 14px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 8px 14px; border-bottom: 1px solid var(--line); vertical-align: middle; }
tr:last-child td { border-bottom: none; }
td.d { white-space: nowrap; color: var(--muted); font-size: 13px; }
td.t { min-width: 180px; overflow-wrap: anywhere; }
td.a, th.a { text-align: right; white-space: nowrap; }
.catpick { position: relative; display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px 3px 8px; background: var(--bg); max-width: 220px; }
.catpick select { appearance: none; -webkit-appearance: none; border: none; background: transparent; padding: 0 14px 0 0; cursor: pointer; font-size: 13px; max-width: 180px; text-overflow: ellipsis; }
.catpick::after { content: ""; position: absolute; right: 10px; top: 50%; width: 6px; height: 6px; border-right: 1.5px solid var(--muted); border-bottom: 1.5px solid var(--muted); transform: translateY(-70%) rotate(45deg); pointer-events: none; }
.catpick.unc { border-color: var(--warn-fg); background: var(--warn-bg); }
.more { text-align: center; padding: 14px; }
.empty { text-align: center; color: var(--muted); padding: 40px 16px; }

.catlist { display: flex; flex-direction: column; }
.catedit { display: grid; grid-template-columns: auto minmax(0, 1fr) auto auto; gap: 10px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); }
.catedit:last-child { border-bottom: none; }
.catedit input[type="color"] { width: 28px; height: 28px; border: none; padding: 0; background: none; cursor: pointer; border-radius: 50%; }
.catedit .inp { padding: 6px 10px; }
.catedit .meta { color: var(--muted); font-size: 13px; text-align: right; white-space: nowrap; }
.rules { max-height: 420px; overflow: auto; }
.rule { display: flex; gap: 10px; align-items: center; padding: 6px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
.rule code { font-family: var(--font-mono); font-size: 12px; flex: 1; min-width: 0; overflow-wrap: anywhere; }
.stack { display: flex; flex-direction: column; gap: 28px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.hint { color: var(--muted); font-size: 13px; margin: 0 0 12px; max-width: 65ch; }
.status { font-size: 13px; color: var(--muted); display: inline-flex; gap: 6px; align-items: center; }
.status .dot { width: 8px; height: 8px; background: var(--good); }
.status.local .dot { background: var(--warn-fg); }

.overlay { position: fixed; inset: 0; background: rgba(10, 20, 17, .45); display: grid; place-items: center; z-index: 50; padding: 16px; }
.modal { background: var(--surface); border-radius: 16px; padding: 22px; width: min(720px, 100%); max-height: calc(100% - 32px); overflow: auto; box-shadow: 0 20px 60px rgba(0,0,0,.3); }
.modal h3 { font-family: var(--font-display); font-size: 22px; margin: 0 0 4px; }
.maprow { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin: 16px 0; }
.maprow label { display: flex; flex-direction: column; gap: 4px; font-size: 13px; font-weight: 600; color: var(--muted); }
.radio { display: flex; flex-direction: column; gap: 6px; margin: 8px 0 16px; }
.radio label { display: flex; gap: 8px; align-items: flex-start; cursor: pointer; }
.preview { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; margin-bottom: 16px; }
.preview td, .preview th { font-size: 13px; padding: 6px 10px; }
.modal-actions { display: flex; justify-content: flex-end; gap: 10px; flex-wrap: wrap; }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(20px + env(safe-area-inset-bottom, 0px)); background: var(--fg); color: var(--bg); border-radius: 12px; padding: 10px 12px 10px 16px; display: flex; gap: 12px; align-items: center; box-shadow: 0 10px 30px rgba(0,0,0,.25); z-index: 60; max-width: calc(100% - 32px); flex-wrap: wrap; }
.toast .btn { background: transparent; color: var(--bg); border-color: color-mix(in srgb, var(--bg) 40%, transparent); padding: 5px 10px; }

@media (max-width: 760px) {
  .grid2 { grid-template-columns: minmax(0, 1fr); }
  .maprow { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 560px) {
  .stats { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  .stats .stat:last-child { grid-column: 1 / -1; }
  .brand small { display: none; }
  table.tx thead { display: none; }
  table.tx tr { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 10px; padding: 10px 14px; border-bottom: 1px solid var(--line); }
  table.tx td { border: none; padding: 0; }
  table.tx td.t { min-width: 0; grid-column: 1; font-weight: 500; }
  table.tx td.a { grid-column: 2; grid-row: 1; }
  table.tx td.d { grid-column: 2; grid-row: 2; text-align: right; }
  table.tx td.c { grid-column: 1; grid-row: 2; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="shell">
  <header class="top">
    <div class="brand"><span class="mark" aria-hidden="true"></span><h1>Pengakoll</h1><small>Vart tog pengarna vägen?</small></div>
    <div class="top-actions">
      <select class="sel" id="period" aria-label="Period"></select>
      <button class="btn primary" id="uploadBtn" type="button">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M8 11V2m0 0L4.5 5.5M8 2l3.5 3.5M2.5 10.5v2a1 1 0 0 0 1 1h9a1 1 0 0 0 1-1v-2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Ladda upp transaktioner
      </button>
      <input type="file" id="fileInput" accept=".csv,.txt,.xlsx,.xls,.json" multiple hidden>
    </div>
  </header>
  <nav class="tabs" role="tablist">
    <button role="tab" id="tab-overview" data-view="overview" aria-selected="true">Översikt</button>
    <button role="tab" id="tab-tx" data-view="tx" aria-selected="false">Transaktioner <span class="count" id="txCount"></span></button>
    <button role="tab" id="tab-cats" data-view="cats" aria-selected="false">Kategorier &amp; inställningar</button>
  </nav>
  <div id="banner"></div>
  <main id="view"></main>
</div>
<div id="modalRoot"></div>
<div id="toastRoot"></div>

function niceMax(v) {
  if (v <= 0) return 1000;
  const p = Math.pow(10, Math.floor(Math.log10(v)));
  for (const m of [1, 2, 2.5, 5, 10]) if (m * p >= v) return m * p;
  return 10 * p;
}
function monthChart() {
  const ms = months().slice(0, 12).reverse();

  const vals = ms.map(m => summarize(state.tx.filter(t => t.d.startsWith(m))).spent);
  const top = niceMax(Math.max(...vals));
  const grid = [1, 0.5, 0].map(f => `<div class="gl" style="bottom:${f * 100}%"><span class="num">${fmtShort.format(top * f)}</span></div>`).join("");
  return `<h2>Månad för månad <span class="aside">utgifter, kr</span></h2>
    <div class="chart">${grid}${ms.map((m, i) => `<button class="col ${state.period === m ? "sel" : ""}" type="button" data-month="${m}" title="${monthLabel(m, true)}: ${fmt0.format(vals[i])}" aria-label="${monthLabel(m, true)}: ${fmt0.format(vals[i])}"><i style="height:${Math.max(0, vals[i] / top) * 100}%"></i></button>`).join("")}</div>
    <div class="chart-x">${ms.map(m => `<span>${monthLabel(m, false)}</span>`).join("")}</div>
    <p class="hint" style="margin:10px 0 0">Tryck på en månad för att se bara den.</p>`;
}

    <div class="catrow" style="cursor:default"><span class="name"><span class="dot" style="background:${c.color}"></span><span>${esc(t.t)}</span></span><span class="amt num">${fmt0.format(-t.a)}</span></div>`; }).join("")}</div>` : `<p class="empty">Inga köp.</p>`}`;
}
function catOptions(selected) {

let clearArmed = 0;
document.addEventListener("click", async e => {
  const t = e.target.closest("[data-act],[data-cat],[data-month],[data-del],[data-unrule]");
  if (!t) return;
  if (t.dataset.cat) { state.view = "tx"; state.filter = { q: "", cat: t.dataset.cat }; render(); window.scrollTo(0, 0); return; }
  if (t.dataset.month) { state.period = state.period === t.dataset.month ? "all" : t.dataset.month; render(); return; }
  if (t.dataset.del) {
    if (!t.classList.contains("armed")) { t.classList.add("armed"); t.textContent = "Bekräfta"; setTimeout(() => { if (t.isConnected) { t.classList.remove("armed"); t.textContent = "Ta bort"; } }, 4000); return; }
    const id = t.dataset.del, c = catById(id);
    state.tx.forEach(x => { if (x.c === id) x.c = "uncategorized"; });
    for (const k in state.rules) if (state.rules[k] === id) delete state.rules[k];
    state.categories = state.categories.filter(x => x.id !== id);
    scheduleSave(); render(); toast(`Tog bort ${c.name}.`);
    return;
  }
  if (t.dataset.unrule) { delete state.rules[t.dataset.unrule]; scheduleSave(); render(); return; }
  const act = t.dataset.act;
  if (act === "upload") document.getElementById("fileInput").click();

  else if (act === "clear") {

    state.tx = []; state.isExample = false; scheduleSave(); render(); toast("Alla transaktioner raderade.");
  }
});
document.addEventListener("change", e => {

  if (el.dataset.color) { const c = catById(el.dataset.color); c.color = el.value; scheduleSave(); return; }

function changeCategory(txId, catId) {
  const tx = state.tx.find(x => x.i === txId);
  if (!tx) return;
  tx.c = catId; tx.m = 1;
  const key = merchantKey(tx.t);
  state.rules[key] = catId;
  const others = state.tx.filter(x => x !== tx && !x.m && x.c !== catId && merchantKey(x.t) === key);
  scheduleSave();
  const row = document.querySelector(`tr[data-id="${CSS.escape(txId)}"]`);
  if (row) { const c = catOf(tx); const pick = row.querySelector(".catpick"); pick.classList.toggle("unc", c.id === "uncategorized"); pick.querySelector(".dot").style.background = c.color; }
  const name = catById(catId).name;
  if (others.length) {
    toast(`Flyttad till ${name}. Flytta ${others.length} till från ”${key}” också?`, "Flytta alla", () => {
      others.forEach(x => { x.c = catId; });
      scheduleSave(); render(); toast(`Flyttade ${others.length + 1} transaktioner till ${name}.`);
    });

    toast(`Flyttad till ${name}. Framtida köp från ”${key}” hamnar där också.`);
  }
}

// ---------- Claude sorting (sample capability) ----------
let sampleApi = null, downloadsApi = null;
async function sortWithClaude(btn) {
  const unc = state.tx.filter(t => t.c === "uncategorized" || !catById(t.c));
  const keys = [...new Set(unc.map(t => merchantKey(t.t)))].slice(0, 150);
  if (!keys.length) return;
  const names = state.categories.filter(c => c.id !== "uncategorized").map(c => c.name);
  btn.disabled = true; btn.textContent = "Claude sorterar…";
  try {
    const prompt = `You sort Swedish bank and card transactions into budget categories.
Categories: ${JSON.stringify(names)}
For each merchant text below, choose the single best category name from the list, copied exactly. If you really can't tell, use "${catById("uncategorized").name}".
Merchants: ${JSON.stringify(keys)}
Reply with only a JSON object mapping each merchant text to a category name.`;
    const result = await sampleApi.json(prompt, { modelTier: "quick" });
    const byName = new Map(state.categories.map(c => [c.name.toLowerCase(), c.id]));
    let moved = 0;
    for (const [k, name] of Object.entries(result || {})) {
      const id = byName.get(String(name).toLowerCase());
      if (!id || id === "uncategorized") continue;
      state.rules[k] = id;
      unc.forEach(t => { if (merchantKey(t.t) === k) { t.c = id; moved++; } });
    }
    scheduleSave(); render();
    toast(moved ? `Claude sorterade ${moved} transaktioner. Kolla dem under fliken Transaktioner.` : "Claude kunde inte placera någon av dem. Du kan sortera dem själv.");
  } catch (e) {
    btn.disabled = false; btn.textContent = "Låt Claude sortera";
    if (e?.code === "not_granted") { sampleApi = null; render(); }
    toast(e?.code === "rate_limited" ? "Claude är upptagen just nu. Försök igen om en minut." : "Claude kunde inte sortera dem den här gången. Du kan sortera dem själv.");
  }
}

// ---------- Storage: your private space in your Claude account, or this browser ----------
const LS_KEY = "pengakoll:v1";
const CHUNK = 700;
const storage = { mode: "local", col: null, written: new Map(), saving: false, again: false, timer: null };
function lsGet() { try { return JSON.parse(localStorage.getItem(LS_KEY) || "null"); } catch { return null; } }
function lsSet(v) { try { localStorage.setItem(LS_KEY, JSON.stringify(v)); return true; } catch { return false; } }
function applyLoaded(d) {
  if (!d) return false;
  if (Array.isArray(d.categories) && d.categories.length) state.categories = d.categories;
  for (const c of state.categories) { const def = DEFAULT_CATS.find(x => x.id === c.id); if (def && c.name === OLD_NAMES[c.id]) c.name = def.name; }
  if (!catById("uncategorized")) state.categories.push(structuredClone(DEFAULT_CATS.at(-1)));
  state.rules = d.rules || {};
  state.tx = (d.tx || []).sort((x, y) => y.d.localeCompare(x.d));
  return state.tx.length > 0 || Object.keys(state.rules).length > 0;
}
async function initStorage() {
  const use = window.claude?.use?.bind(window.claude);
  let loaded = false;
  if (use) {
    const [db, user, sample, downloads] = await Promise.all([use("db"), use("user"), use("sample"), use("downloads")]).catch(() => [null, null, null, null]);
    sampleApi = sample; downloadsApi = downloads;
    const id = db && user ? await user.id().catch(() => null) : null;
    if (db && id) {
      try {
        storage.col = db.collection("data/users/" + id);
        const snap = await storage.col.get();
        const d = { tx: [] };
        for (const doc of snap.docs) {
          const body = doc.data();
          storage.written.set(doc.id, JSON.stringify(body));
          if (doc.id === "meta") { d.categories = body.categories; d.rules = body.rules; }
          else if (doc.id.startsWith("chunk-")) d.tx.push(...(body.tx || []));
        }
        storage.mode = "account";
        loaded = applyLoaded(d);
        if (!loaded) { const local = lsGet(); if (local && applyLoaded(local)) { loaded = true; scheduleSave(); } }
      } catch { storage.col = null; }
    }
  }
  if (storage.mode === "local") loaded = applyLoaded(lsGet());
  state.loading = false;
  if (!loaded) loadExample();
  render();
}
function scheduleSave() {
  if (state.isExample) return;
  clearTimeout(storage.timer);
  storage.timer = setTimeout(saveNow, 700);
}
async function saveNow() {
  if (storage.saving) { storage.again = true; return; }
  storage.saving = true;
  const payload = { categories: state.categories, rules: state.rules, tx: state.tx };
  if (storage.mode === "account") {
    try {
      const docs = new Map([["meta", { categories: state.categories, rules: state.rules }]]);
      const sorted = [...state.tx].sort((a, b) => a.i.localeCompare(b.i));
      for (let i = 0; i * CHUNK < sorted.length; i++) docs.set("chunk-" + String(i).padStart(4, "0"), { tx: sorted.slice(i * CHUNK, (i + 1) * CHUNK) });
      for (const [id, body] of docs) {
        const json = JSON.stringify(body);
        if (storage.written.get(id) === json) continue;
        await storage.col.doc(id).set(body);
        storage.written.set(id, json);
      }
      for (const id of [...storage.written.keys()]) {
        if (id.startsWith("chunk-") && !docs.has(id)) { await storage.col.doc(id).delete(); storage.written.delete(id); }
      }
    } catch (e) {
      storage.mode = "local";
      if (e?.code === "quota_exceeded") toast("Lagringen i ditt konto är full. Sparar i den här webbläsaren i stället.");
      lsSet(payload);
      if (state.view === "cats") render();
    }
  } else if (!lsSet(payload)) {
    toast("Kunde inte spara i den här webbläsaren. Ladda ner en säkerhetskopia så att du inte förlorar dina ändringar.");
  }
  storage.saving = false;
  if (storage.again) { storage.again = false; saveNow(); }
}
